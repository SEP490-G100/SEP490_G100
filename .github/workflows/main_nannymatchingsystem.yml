# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - NannyMatchingSystem

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_PATH: UI/WebSite/WebSite/WebSite.csproj
  PUBLISH_PATH: ${{ github.workspace }}/myapp
  APP_NAME: nannymatch-ui

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Build with dotnet
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release

      - name: dotnet publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c Release --no-build -o "${{ env.PUBLISH_PATH }}"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: frontend-publish
          path: ${{ env.PUBLISH_PATH }}

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: frontend-publish
          path: ${{ env.PUBLISH_PATH }}

      - name: Print deploying commit
        run: echo "Deploying frontend commit ${{ github.sha }}"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_UI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_UI_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_UI_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: "Production"
          package: ${{ env.PUBLISH_PATH }}
