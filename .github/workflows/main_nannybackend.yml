# .github/workflows/main_nannybackend.yml
name: Build and deploy ASP.NET Core backend to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_PATH: Backend/Nanny_BackEnd/Nanny_BackEnd/Nanny_BackEnd.csproj
  PUBLISH_PATH: ${{ github.workspace }}/backendapp
  APP_NAME: nannymatch-be-g100

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release

      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c Release --no-build -o "${{ env.PUBLISH_PATH }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ${{ env.PUBLISH_PATH }}
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: ${{ env.PUBLISH_PATH }}

      - name: Print deploying commit
        run: echo "Deploying backend commit ${{ github.sha }}"

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_BACKEND_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_BACKEND_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_BACKEND_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: ${{ env.PUBLISH_PATH }}

      - name: Verify backend health endpoint
        shell: pwsh
        run: |
          $healthUrl = "https://${{ env.APP_NAME }}.azurewebsites.net/health"
          Write-Host "Checking $healthUrl"
          try {
            $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 60
            Write-Host "Health status code: $($response.StatusCode)"
            if ($response.StatusCode -ne 200) {
              throw "Health check failed with status code $($response.StatusCode)"
            }
          } catch {
            Write-Error "Backend health check failed: $($_.Exception.Message)"
            throw
          }
